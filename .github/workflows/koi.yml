name: Refresh Profile Koi

on:
  schedule:
    # Just after midnight UTC, so the koi reflects the day that just ended.
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - preview/git-profile-koi
      - main
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    name: Generate and Update Profile Koi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Profile Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: ${{ github.repository_owner }}
          body: white
          output-dir: assets/koi

      - name: Commit and push changes
        shell: bash
        run: |
          git add assets/koi/koi.gif assets/koi/koi.png
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update activity koi [skip ci]"
          git push origin HEAD
