name: Refresh WakaTime Coding Activity Graph

'on':
  schedule:
    # Run approximately every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Prevent concurrent runs from conflicting
concurrency:
  group: coding-activity
  cancel-in-progress: false

# Minimal permissions required to commit and push updated SVG
permissions:
  contents: write

jobs:
  update-activity-graph:
    name: Generate and Update Activity SVG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify test suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Generate coding activity graph
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_JSON_URL: ${{ secrets.WAKATIME_JSON_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_activity_graph.py --output assets/coding-activity.svg

      - name: Validate generated SVG
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('assets/coding-activity.svg')
          root = tree.getroot()
          assert root.tag.endswith('svg'), 'Root element is not svg'
          assert 'viewBox' in root.attrib, 'viewBox missing'
          print('SVG validation successful.')
          "

      - name: Commit and push changes
        run: |
          if git diff --quiet assets/coding-activity.svg; then
            echo "No changes in coding activity graph. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/coding-activity.svg
          git commit -m "chore(activity): update WakaTime coding activity graph [skip ci]"

          # Retry loop with fetch and rebase to handle concurrent commits safely
          MAX_RETRIES=5
          RETRY_COUNT=0
          PUSH_SUCCESS=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Fetching latest changes from origin/main..."
            if git rev-parse --is-shallow-repository 2>/dev/null | grep -q true; then
              git fetch --unshallow origin main || git fetch origin main
            else
              git fetch origin main
            fi

            echo "Rebasing commit onto origin/main..."
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict detected while integrating origin/main. Aborting safely to protect remote changes."
              git rebase --abort || true
              exit 1
            fi

            echo "Pushing changes to origin/main..."
            if git push origin main; then
              echo "Successfully pushed updated activity graph to main."
              PUSH_SUCCESS=1
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::warning::Push rejected due to concurrent remote changes. Retrying ($RETRY_COUNT/$MAX_RETRIES) in $((RETRY_COUNT * 2))s..."
            sleep $((RETRY_COUNT * 2))
          done

          if [ $PUSH_SUCCESS -ne 1 ]; then
            echo "::error::Failed to push changes to main after $MAX_RETRIES attempts due to concurrent updates."
            exit 1
          fi
